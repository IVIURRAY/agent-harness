[project]
name = "agent-harness"
version = "0.1.0"
description = "A small, from-scratch agent harness: loop, tools, sandbox, approvals, context management, tracing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "openai>=1.60",       # OpenAI-compatible endpoints (OpenRouter, Ollama, vLLM...)
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[dependency-groups]
dev = ["pytest>=8"]
docs = [
    "pillow>=13.0.0",
    "pyte>=0.8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
